[project]
name = "synthesis"
version = "0.1.0"
description = "Block synthesis — downward (block to analog circuit) and sideways (block to C/C++/Python firmware)."
requires-python = ">=3.11"
dependencies = [
    "blocks",
    "components",
    "sympy>=1.13",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthesis"]
