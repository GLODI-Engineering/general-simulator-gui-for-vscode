[project]
name = "simulator"
version = "0.1.0"
description = "Simulation pipeline — compiler, IR, symbolic processor, solver adapters, post-processing."
requires-python = ">=3.11"
dependencies = [
    "schemas",
    "components",
    "blocks",
    "gsim-tools",
    "numpy>=1.26",
    "scipy>=1.13",
    "sympy>=1.13",
    "h5py>=3.11",
    "networkx>=3.3",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
markers = [
    "integration: requires external simulator binaries (ngspice, Xyce) on the host",
]
