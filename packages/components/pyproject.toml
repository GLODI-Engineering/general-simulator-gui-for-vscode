[project]
name = "components"
version = "0.1.0"
description = "Device model registry — passive, semiconductor, sources. Equation templates per model level."
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/components"]
