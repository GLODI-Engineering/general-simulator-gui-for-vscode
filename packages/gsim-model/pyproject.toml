[project]
name = "gsim-model"
version = "0.1.0"
description = "Hand-written pydantic model + programmatic manipulation/connectivity API for .gsim_sch v2 documents."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "simulator",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsim_model"]
