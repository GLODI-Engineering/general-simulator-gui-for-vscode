      - {id: r, kind: physical-rotational, direction: inout}
      - {id: e, kind: physical-electrical, direction: inout}
    params:
      - {id: kt, type: number, default: 0.01}
      - {id: ke, type: number, default: 0.01}
    doc: Ideal generator coupling between rotational and electrical domains.
symbol:
  bbox: [90, 40]
  shape: rect
  text: r-e
behavior:
  causality: acausal
  domain: mixed
  state_count: 0
  equation_template: converter.rotational_to_electrical
