name: converter.rotational_to_electrical
type: converter.rotational_to_electrical
label: Rotational to Electrical
version: 1
category: power
description: Converts rotational mechanical energy to electrical energy (generator model).
paradigm: converter
domain: physical-electrical
aliases: [rotational to electrical, generator]
tags: [converter]
ports:
  inputs:
    - {id: r, label: r, kind: {domain: physical-rotational}, side: left, offset: 20}
  outputs:
    - {id: e, label: e, kind: {domain: physical-electrical}, side: right, offset: 20}
params:
  - {name: kt, label: Torque constant (N·m/A), type: number, default: 0.01}
  - {name: ke, label: Back-EMF constant (V·s/rad), type: number, default: 0.01}
fidelities:
