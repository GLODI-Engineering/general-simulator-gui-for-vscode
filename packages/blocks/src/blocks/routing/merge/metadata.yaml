name: routing.merge
label: Merge
version: 1
description: Passes through the most recently active of multiple variadic inputs of equal kind and dim.
paradigm: routing
domain: signal
aliases: [merge, signal merge]
tags: [routing, conditional, signal-flow]
params:
  - name: n_inputs
    label: Number of inputs
    type: integer
    default: 2
    description: Number of input ports (in0..in{n_inputs-1}).
ports:
  inputs:
    - id: in0
      label: ""
      kind: {domain: signal, dims: scalar}
      side: left
      offset: 10
    - id: in1
      label: ""
      kind: {domain: signal, dims: scalar}
      side: left
      offset: 30
  outputs:
    - id: out
      label: ""
      kind: {domain: signal, dims: scalar}
      side: right
      offset: 20
fidelities:
  - tier: n_a
    ports:
      - {id: in0, kind: signal, direction: in, side: left, offset: 10}
      - {id: in1, kind: signal, direction: in, side: left, offset: 30}
      - {id: out, kind: signal, direction: out, side: right, offset: 20}
    params:
      - {id: n_inputs, type: integer, default: 2, doc: Number of input ports.}
    doc: Passes through the most recently active input.
symbol: {bbox: [60, 60], shape: rect, text: Merge}
behavior: {causality: causal, domain: signal, state_count: 0, equation_template: routing.merge}
port_sigs:
  "in*": "inherit"
  out: "from(in0)"
