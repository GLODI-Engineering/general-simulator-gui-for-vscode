name: routing.bus_assignment
label: Bus Assignment
version: 1
description: Replaces named elements in a signal-bus with new input values.
paradigm: routing
domain: signal
aliases: [bus assignment, replace bus element]
tags: [routing, bus, signal-flow]
params:
  - name: elements
    label: Elements
    type: string
    default: "a"
    description: Comma-separated list of element names to replace in the bus.
ports:
  inputs:
    - id: bus
      label: ""
      kind: {domain: signal-bus, dims: scalar}
      side: left
      offset: 10
    - id: val0
      label: ""
      kind: {domain: signal, dims: scalar}
      side: left
      offset: 30
  outputs:
    - id: out
      label: ""
      kind: {domain: signal-bus, dims: scalar}
      side: right
      offset: 20
fidelities:
  - tier: n_a
    ports:
      - {id: bus, kind: signal-bus, direction: in, side: left, offset: 10}
      - {id: val0, kind: signal, direction: in, side: left, offset: 30}
      - {id: out, kind: signal-bus, direction: out, side: right, offset: 20}
    params:
      - {id: elements, type: string, default: "a", doc: Comma-separated element names to replace.}
    doc: Replaces named elements in a signal-bus with new values.
symbol: {bbox: [70, 60], shape: rect, text: Bus\nAssign}
behavior: {causality: causal, domain: signal, state_count: 0, equation_template: routing.bus_assignment}
port_sigs:
  bus: "bus"
  "val*": "inherit"
  out: "bus(elements)"
