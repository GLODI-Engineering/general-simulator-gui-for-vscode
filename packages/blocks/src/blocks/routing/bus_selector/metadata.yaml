name: routing.bus_selector
label: Bus Selector
version: 1
description: Unpacks named elements from a signal-bus into individual signal outputs.
paradigm: routing
domain: signal
aliases: [bus selector, demux bus, unpack bus]
tags: [routing, bus, signal-flow]
params:
  - name: elements
    label: Elements
    type: string
    default: "a,b"
    description: Comma-separated list of element names to extract from the bus.
ports:
  inputs:
    - id: bus
      label: ""
      kind: {domain: signal-bus, dims: scalar}
      side: left
      offset: 20
  outputs:
    - id: out0
      label: ""
      kind: {domain: signal, dims: scalar}
      side: right
      offset: 10
    - id: out1
      label: ""
      kind: {domain: signal, dims: scalar}
      side: right
      offset: 30
fidelities:
  - tier: n_a
    ports:
      - {id: bus, kind: signal-bus, direction: in, side: left, offset: 20}
      - {id: out0, kind: signal, direction: out, side: right, offset: 10}
      - {id: out1, kind: signal, direction: out, side: right, offset: 30}
    params:
      - {id: elements, type: string, default: "a,b", doc: Comma-separated element names.}
    doc: Unpacks named elements from a signal-bus.
symbol: {bbox: [70, 60], shape: rect, text: Bus\nSelector}
behavior: {causality: causal, domain: signal, state_count: 0, equation_template: routing.bus_selector}
port_sigs:
  bus: "bus"
  "out*": "from(elements)"
