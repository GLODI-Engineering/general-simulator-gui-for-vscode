name: hierarchy.inport
label: Inport
version: 1
category: subsystems
description: "Boundary inport — placed inside a subsystem body to define an input port on the parent-side block (spec §11). The `id` param is the port id; `kind` selects the signal domain."

aliases: [inport, boundary inport]
tags: [hierarchy, subsystem, inport, boundary]

ports:
  inputs: []
  outputs:
    - id: out
      label: ""
      # The domain is chosen by the `kind` param, not fixed here. Declared
      # plainly as `signal` it was wrong for four of the five values that
      # param offers, so a physical boundary port drew a signal marker.
      kind: { domain: signal, dims: scalar }
      domain_from: kind
      side: right
      offset: 20

params:
  - name: id
    label: Port id
    type: string
    default: "in1"
    description: Port identifier on the parent-side subsystem block.
  - name: kind
    label: Signal kind
    type: enum
    default: "signal"
    choices: ["signal", "physical-electrical", "physical-thermal", "physical-translational", "physical-rotational"]
    description: Port kind domain exposed to the parent.

symbol:
  bbox: [200, 40]
  shape: rect
  text: "In"

behavior:
  causality: source
  domain: signal
  state_count: 0
  equation_template: hierarchy.inport
