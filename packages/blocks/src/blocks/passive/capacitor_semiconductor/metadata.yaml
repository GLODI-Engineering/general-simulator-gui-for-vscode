name: passive.capacitor.semiconductor
label: Semiconductor Capacitor
version: 1
category: passive
description: Semiconductor capacitor with W/L scaling.

aliases: [C semiconductor, junction capacitor]
tags: [passive, electrical, capacitor, semiconductor]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 20

params:
  - name: C
    label: Capacitance
    type: number
    default: 1.0e-6
    description: Capacitance in farads.
  - name: W
    label: Width
    type: number
    default: 1.0e-6
    description: Capacitor width in meters.
  - name: L
    label: Length
    type: number
    default: 1.0e-6
    description: Capacitor length in meters.
  - name: model
    label: Model
    type: string
    default: ""
    description: SPICE model name.

symbol:
  bbox: [60, 40]
  shape: rect
  text: C (semi)

behavior:
  causality: acausal
  domain: electrical
  state_count: 1
  equation_template: passive.capacitor.semiconductor
