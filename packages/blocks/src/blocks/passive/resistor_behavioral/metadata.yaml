name: passive.resistor.behavioral
label: Resistor (expr)
version: 1
category: passive
description: Behavioral resistor with expression-defined resistance.

aliases: [R behavioral, expression resistor]
tags: [passive, electrical, resistor, behavioral]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 20

params:
  - name: R
    label: Resistance
    type: number
    default: 1000.0
    description: Resistance in ohms.
  - name: expr
    label: Expression
    type: string
    default: ""
    description: Expression defining resistance value.

symbol:
  bbox: [60, 40]
  shape: rect
  text: R (expr)

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: passive.resistor.behavioral
