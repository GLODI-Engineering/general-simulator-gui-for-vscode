name: passive.switch.voltage
label: Voltage-Controlled Switch
version: 1
category: passive
description: Voltage-controlled switch. SPICE element S.

aliases: [SW, voltage switch, voltage-controlled switch]
tags: [passive, electrical, switch, voltage-controlled]

ports:
  inputs:
    - id: p
      label: "p"
      kind: { domain: electrical }
      side: left
      offset: 10
    - id: cp
      label: "c+"
      kind: { domain: electrical }
      side: left
      offset: 30
  outputs:
    - id: n
      label: "n"
      kind: { domain: electrical }
      side: right
      offset: 10
    - id: cn
      label: "c-"
      kind: { domain: electrical }
      side: right
      offset: 30

params:
  - name: model
    label: Model
    type: string
    default: SW
    description: SPICE switch model name.

symbol:
  bbox: [60, 60]
  shape: rect
  text: SW

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: passive.switch.voltage
