        kind: physical-electrical
        direction: inout
        label: "-"
        side: right
        offset: 20
    params:
      - id: R
        type: number
        default: 1000.0
        unit: Ω
        doc: Resistance in ohms.
    doc: Ideal linear resistor.

symbol:
  bbox: [60, 40]
  shape: rect
  text: R

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: passive.resistor
