name: passive.resistor
label: Resistor
version: 1
category: passive
description: Linear resistor. SPICE element R.
paradigm: physical-network
domain: physical-electrical

aliases: [R, resistor, linear resistor]
tags: [passive, electrical, resistor, linear]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 20

params:
