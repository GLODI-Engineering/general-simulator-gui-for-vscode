name: control.product
label: "Product"
version: 1
category: control
description: "Multiplies all of its input signals together."

aliases: [product, multiply, mul]
tags: [control, signal, arithmetic, general-simulator]

ports:
  # Variadic, from `n_inputs` — the engine's own arity for this block is
  # `Arity::ParamCount("n_inputs")`. Declaring two fixed ports meant a product
  # configured with five inputs compiled with five and drew with two.
  inputs: []
  outputs:
    - id: out
      label: ""
      kind: { domain: signal, dims: scalar }
      side: right
      offset: 20
  variadic_inputs:
    count_from: n_inputs
    template:
      id: in
      label: ""
      kind: { domain: signal, dims: scalar }
      side: left
      offset: 0

params:
  - name: n_inputs
    label: "Input count"
    type: integer
    default: 2
    min: 2
    description: "Number of input signals (2-8)."

symbol:
  bbox: [60, 40]
  shape: rect
  text: "x"

behavior:
  causality: causal
  domain: signal
  state_count: 0
  equation_template: control.product

main_param: n_inputs
