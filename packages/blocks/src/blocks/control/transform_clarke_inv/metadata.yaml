name: control.transform.clarke_inv
label: "Inverse Clarke Transform"
version: 1
category: control
description: "Inverse Clarke (alpha-beta-zero to abc) transform."

aliases: [clarke inv, transform, coordinate transform]
tags: [control, signal, transform, motor-control, general-simulator]

ports:
  inputs:
    - id: alpha
      label: "alpha"
      kind: { domain: signal, dims: scalar }
      side: left
      offset: 16
    - id: beta
      label: "beta"
      kind: { domain: signal, dims: scalar }
      side: left
      offset: 33
    - id: zero
      label: "zero"
      kind: { domain: signal, dims: scalar }
      side: left
      offset: 50
  outputs:
    - id: a
      label: "a"
      kind: { domain: signal, dims: scalar }
      side: right
      offset: 16
    - id: b
      label: "b"
      kind: { domain: signal, dims: scalar }
      side: right
      offset: 33
    - id: c
      label: "c"
      kind: { domain: signal, dims: scalar }
      side: right
      offset: 50

params: []

symbol:
  bbox: [80, 66]
  shape: rect
  text: "αβ0/abc"

behavior:
  causality: causal
  domain: signal
  state_count: 0
  equation_template: control.transform.clarke_inv
