name: source.current.sin
label: "I (SIN)"
version: 1
category: sources
description: Sinusoidal current source. SPICE element I with SIN waveform.

aliases: [ISIN, sinusoidal current source]
tags: [source, electrical, current, sine, ac, transient]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: electrical }
      side: right
      offset: 20

params:
  - name: VO
    label: Offset Current
    type: number
    default: 0
    description: Offset current in amperes.
  - name: VA
    label: Amplitude
    type: number
    default: 1
    description: Amplitude in amperes.
  - name: FREQ
    label: Frequency
    type: number
    default: 1000
    description: Frequency in hertz.
  - name: TD
    label: Delay Time
    type: number
    default: 0
    description: Delay before waveform starts.
  - name: THETA
    label: Damping Factor
    type: number
    default: 0
    description: Exponential damping factor.
  - name: PHASE
    label: Phase
    type: number
    default: 0
    description: Phase in degrees.

symbol:
  bbox: [60, 40]
  shape: circle
  text: "I (SIN)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.current.sin
