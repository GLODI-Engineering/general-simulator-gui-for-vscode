name: source.ideal_delay
label: Ideal Delay
version: 1
category: sources
description: Ideal delayed source element. Xyce only.

aliases: [delay, ideal delay]
tags: [source, electrical, delay, xyce-only]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 20

params:
  - name: TD
    label: Delay Time
    type: number
    default: 1e-9
    description: Delay time in seconds.

symbol:
  bbox: [60, 40]
  shape: rect
  text: DELAY

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.ideal_delay
