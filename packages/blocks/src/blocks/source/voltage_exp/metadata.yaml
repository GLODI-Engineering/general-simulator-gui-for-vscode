name: source.voltage.exp
label: "V (EXP)"
version: 1
category: sources
description: Exponential voltage source. SPICE element V with EXP waveform.

aliases: [VEXP, exponential voltage source]
tags: [source, electrical, voltage, exponential, transient]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: electrical }
      side: right
      offset: 20

params:
  - name: V1
    label: Initial Voltage
    type: number
    default: 0.0
    description: initial voltage in volts
  - name: V2
    label: Pulsed Voltage
    type: number
    default: 1.0
    description: pulsed voltage in volts
  - name: TD1
    label: Rise Delay
    type: number
    default: 0.0
    description: rise delay
  - name: TAU1
    label: Rise Tau
    type: number
    default: 1e-9
    description: rise tau
  - name: TD2
    label: Fall Delay
    type: number
    default: 1e-6
    description: fall delay
  - name: TAU2
    label: Fall Tau
    type: number
    default: 10e-9
    description: fall tau

symbol:
  bbox: [60, 40]
  shape: circle
  text: "V (EXP)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.voltage.exp
