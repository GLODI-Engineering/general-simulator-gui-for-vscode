name: source.voltage.sffm
label: "V (SFFM)"
version: 1
category: sources
description: Single-frequency FM voltage source. SPICE element V with SFFM waveform.

aliases: [VSFFM, FM voltage source]
tags: [source, electrical, voltage, sffm, fm, transient]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 20

params:
  - name: VO
    label: Offset Voltage
    type: number
    default: 0.0
    description: offset voltage in volts
  - name: VA
    label: Amplitude
    type: number
    default: 1.0
    description: amplitude in volts
  - name: FC
    label: Carrier Frequency
    type: number
    default: 1000.0
    description: carrier freq
  - name: MDI
    label: Modulation Index
    type: number
    default: 0.5
    description: modulation index
  - name: FS
    label: Signal Frequency
    type: number
    default: 100.0
    description: signal freq

symbol:
  bbox: [60, 40]
  shape: circle
  text: "V (SFFM)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.voltage.sffm
