name: source.current.exp
label: "I (EXP)"
version: 1
category: sources
description: Exponential current source. SPICE element I with EXP waveform.

aliases: [IEXP, exponential current source]
tags: [source, electrical, current, exponential, transient]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: electrical }
      side: right
      offset: 20

params:
  - name: I1
    label: Initial Current
    type: number
    default: 0
    description: Initial current in amperes.
  - name: I2
    label: Pulsed Current
    type: number
    default: 1
    description: Pulsed current in amperes.
  - name: TD1
    label: Rise Delay
    type: number
    default: 0
    description: Rise delay.
  - name: TAU1
    label: Rise Tau
    type: number
    default: 1e-9
    description: Rise time constant.
  - name: TD2
    label: Fall Delay
    type: number
    default: 1e-6
    description: Fall delay.
  - name: TAU2
    label: Fall Tau
    type: number
    default: 10e-9
    description: Fall time constant.

symbol:
  bbox: [60, 40]
  shape: circle
  text: "I (EXP)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.current.exp
