name: source.dependent.ccvs
label: CCVS
version: 1
category: dependent
description: Current-controlled voltage source. SPICE element H.

aliases: [H, ccvs, current-controlled voltage source]
tags: [source, electrical, dependent, ccvs]

ports:
  inputs:
    - id: ctrl
      label: CTRL
      kind: { domain: physical-electrical }
      side: bottom
      offset: 40
  outputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: left
      offset: 40
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 40

params:
  - name: gain
    label: Gain
    type: number
    default: 1000
    description: Transresistance in ohms.

symbol:
  bbox: [80, 80]
  shape: rect
  text: H

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: source.dependent.ccvs
