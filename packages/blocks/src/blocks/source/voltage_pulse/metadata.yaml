name: source.voltage.pulse
label: "V (PULSE)"
version: 1
category: sources
description: Pulsed voltage source. SPICE element V with PULSE waveform.

aliases: [VPULSE, pulse voltage source]
tags: [source, electrical, voltage, pulse, transient]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 20

params:
  - name: V1
    label: Initial Voltage
    type: number
    default: 0.0
    description: Initial (off) voltage in volts
  - name: V2
    label: Pulsed Voltage
    type: number
    default: 1.0
    description: Pulsed (on) voltage in volts
  - name: TD
    label: Delay Time
    type: number
    default: 0.0
    description: delay
  - name: TR
    label: Rise Time
    type: number
    default: 1e-9
    description: rise time
  - name: TF
    label: Fall Time
    type: number
    default: 1e-9
    description: fall time
  - name: PW
    label: Pulse Width
    type: number
    default: 500e-9
    description: pulse width
  - name: PER
    label: Period
    type: number
    default: 1e-6
    description: period

symbol:
  bbox: [60, 40]
  shape: circle
  text: "V (PULSE)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.voltage.pulse
