name: source.voltage.random
label: "V (RANDOM)"
version: 1
category: sources
description: Random voltage source (ngspice only). SPICE element V with RANDOM waveform.

aliases: [VRANDOM, random voltage source]
tags: [source, electrical, voltage, random, ngspice]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: electrical }
      side: right
      offset: 20

params:
  - name: TYPE
    label: Distribution Type
    type: integer
    default: 2
    description: "distribution: 1=uniform 2=Gaussian 3=exp 4=Poisson"
  - name: TS
    label: Time Step
    type: number
    default: 1e-6
    description: time step
  - name: TD
    label: Delay Time
    type: number
    default: 0.0
    description: delay
  - name: PARAM1
    label: Parameter 1
    type: number
    default: 0.0
    description: distribution parameter 1
  - name: PARAM2
    label: Parameter 2
    type: number
    default: 1.0
    description: distribution parameter 2

symbol:
  bbox: [60, 40]
  shape: circle
  text: "V (RANDOM)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.voltage.random
