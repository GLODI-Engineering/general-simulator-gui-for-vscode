name: source.voltage.am
label: "V (AM)"
version: 1
category: sources
description: Amplitude-modulated voltage source. SPICE element V with AM waveform.

aliases: [VAM, AM voltage source]
tags: [source, electrical, voltage, am, transient]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: electrical }
      side: right
      offset: 20

params:
  - name: VA
    label: Amplitude
    type: number
    default: 1.0
    description: amplitude in volts
  - name: FC
    label: Carrier Frequency
    type: number
    default: 1000.0
    description: carrier freq
  - name: FM
    label: Modulation Frequency
    type: number
    default: 100.0
    description: modulation freq
  - name: VO
    label: Offset Voltage
    type: number
    default: 0.0
    description: offset

symbol:
  bbox: [60, 40]
  shape: circle
  text: "V (AM)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.voltage.am
