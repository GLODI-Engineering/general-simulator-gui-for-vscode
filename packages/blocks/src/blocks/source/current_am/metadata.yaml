name: source.current.am
label: "I (AM)"
version: 1
category: sources
description: Amplitude-modulated current source. SPICE element I with AM waveform.

aliases: [IAM, AM current source]
tags: [source, electrical, current, am, transient]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: electrical }
      side: right
      offset: 20

params:
  - name: VA
    label: Amplitude
    type: number
    default: 1
    description: Amplitude in amperes.
  - name: FC
    label: Carrier Frequency
    type: number
    default: 1000
    description: Carrier frequency in hertz.
  - name: FM
    label: Modulation Frequency
    type: number
    default: 100
    description: Modulation frequency in hertz.
  - name: VO
    label: Offset Current
    type: number
    default: 0
    description: Offset current in amperes.

symbol:
  bbox: [60, 40]
  shape: circle
  text: "I (AM)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.current.am
