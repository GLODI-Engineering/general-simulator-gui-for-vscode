name: source.dependent.vccs
label: VCCS
version: 1
category: dependent
description: Voltage-controlled current source. SPICE element G.

aliases: [G, vccs, voltage-controlled current source]
tags: [source, electrical, dependent, vccs]

ports:
  inputs:
    - id: cp
      label: "C+"
      kind: { domain: physical-electrical }
      side: bottom
      offset: 30
    - id: cn
      label: "C-"
      kind: { domain: physical-electrical }
      side: bottom
      offset: 90
  outputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: left
      offset: 40
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 40
params:
  - name: gain
    label: Gain
    type: number
    default: 0.001
    description: Transconductance in siemens.

symbol:
  bbox: [120, 80]
  shape: rect
  text: G

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: source.dependent.vccs
