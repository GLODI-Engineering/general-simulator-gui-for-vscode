name: source.current.pulse
label: "I (PULSE)"
version: 1
category: sources
description: Pulsed current source. SPICE element I with PULSE waveform.

aliases: [IPULSE, pulse current source]
tags: [source, electrical, current, pulse, transient]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 20

params:
  - name: I1
    label: Initial Current
    type: number
    default: 0
    description: Initial current in amperes.
  - name: I2
    label: Pulsed Current
    type: number
    default: 1
    description: Pulsed current in amperes.
  - name: TD
    label: Delay Time
    type: number
    default: 0
    description: Delay before the first pulse.
  - name: TR
    label: Rise Time
    type: number
    default: 1e-9
    description: Pulse rise time.
  - name: TF
    label: Fall Time
    type: number
    default: 1e-9
    description: Pulse fall time.
  - name: PW
    label: Pulse Width
    type: number
    default: 500e-9
    description: Pulse width.
  - name: PER
    label: Period
    type: number
    default: 1e-6
    description: Pulse period.

symbol:
  bbox: [60, 40]
  shape: circle
  text: "I (PULSE)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.current.pulse
