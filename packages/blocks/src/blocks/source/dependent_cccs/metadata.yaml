name: source.dependent.cccs
label: CCCS
version: 1
category: dependent
description: Current-controlled current source. SPICE element F.

aliases: [F, cccs, current-controlled current source]
tags: [source, electrical, dependent, cccs]

ports:
  inputs:
    - id: ctrl
      label: CTRL
      kind: { domain: physical-electrical }
      side: left
      offset: 30
  outputs:
    - id: p
      label: "+"
      kind: { domain: physical-electrical }
      side: right
      offset: 15
    - id: n
      label: "-"
      kind: { domain: physical-electrical }
      side: right
      offset: 35

params:
  - name: gain
    label: Gain
    type: number
    default: 1
    description: Current gain.

symbol:
  bbox: [60, 60]
  shape: rect
  text: F

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: source.dependent.cccs
