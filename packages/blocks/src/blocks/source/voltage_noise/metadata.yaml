name: source.voltage.noise
label: "V (NOISE)"
version: 1
category: sources
description: Random noise voltage source (ngspice only). SPICE element V with NOISE waveform.

aliases: [VNOISE, noise voltage source]
tags: [source, electrical, voltage, noise, ngspice]

ports:
  inputs:
    - id: p
      label: "+"
      kind: { domain: electrical }
      side: left
      offset: 20
  outputs:
    - id: n
      label: "-"
      kind: { domain: electrical }
      side: right
      offset: 20

params:
  - name: NA
    label: Noise Amplitude
    type: number
    default: 0.001
    description: noise amplitude
  - name: NT
    label: Time Offset
    type: number
    default: 0.0
    description: time offset

symbol:
  bbox: [60, 40]
  shape: circle
  text: "V (NOISE)"

behavior:
  causality: source
  domain: electrical
  state_count: 0
  equation_template: source.voltage.noise
