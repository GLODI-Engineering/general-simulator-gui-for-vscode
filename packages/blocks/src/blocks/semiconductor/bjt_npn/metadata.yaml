name: semi.bjt.npn
label: NPN BJT
version: 1
category: semiconductor
description: "NPN bipolar junction transistor (Gummel-Poon)."

aliases: [Q, npn, bjt npn, NPN]
tags: [semiconductor, electrical, bjt, npn, transistor]

ports:
  inputs:
    - id: b
      label: Base
      kind: { domain: physical-electrical }
      side: left
      offset: 41
  outputs:
    - id: c
      label: Collector
      kind: { domain: physical-electrical }
      side: top
      offset: 46
    - id: e
      label: Emitter
      kind: { domain: physical-electrical }
      side: bottom
      offset: 46
params:
  - name: model
    label: Model
    type: string
    default: ""
    description: SPICE model name.
  - name: area
    label: Area
    type: number
    default: 1.0
    description: area multiplier
  - name: off
    label: Off
    type: bool
    default: false
    description: initial condition off

symbol:
  bbox: [80, 80]
  shape: rect
  text: NPN

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: semi.bjt.npn
