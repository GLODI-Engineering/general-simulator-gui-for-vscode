    label: Model
    type: string
    default: ""
    description: SPICE model name.
  - name: area
    label: Area
    type: number
    default: 1.0
    description: Area multiplier.

symbol:
  bbox: [56, 106]
  shape: rect
  text: MESFET

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: semi.mesfet.n
