aliases: [Z, mesfet, mesfet n, MESFET]
tags: [semiconductor, electrical, mesfet, n-channel, transistor]

ports:
  inputs:
    - id: g
      label: Gate
      kind: { domain: physical-electrical }
      side: left
      offset: 56
  outputs:
    - id: d
      label: Drain
      kind: { domain: physical-electrical }
      side: top
      offset: 56
    - id: s
      label: Source
      kind: { domain: physical-electrical }
      side: bottom
      offset: 56

params:
