name: semi.mosfet.p
label: PMOS
version: 1
category: semiconductor
description: "P-channel MOSFET. Model level set via model param."

aliases: [M, pmos, mosfet p, PMOS]
tags: [semiconductor, electrical, mosfet, p-channel, transistor]

ports:
  inputs:
    - id: g
      label: Gate
      kind: { domain: physical-electrical }
      side: left
      offset: 30
  outputs:
    - id: d
      label: Drain
      kind: { domain: physical-electrical }
      side: top
      offset: 30
    - id: s
      label: Source
      kind: { domain: physical-electrical }
      side: bottom
      offset: 30
params:
  - name: model
    label: Model
    type: string
    default: ""
    description: SPICE model name.
  - name: W
    label: Width
    type: number
    default: 1.0e-6
    description: channel width m
  - name: L
    label: Length
    type: number
    default: 180.0e-9
    description: channel length m
  - name: M
    label: Multiplier
    type: integer
    default: 1
    description: multiplier
  - name: AD
    label: AD
    type: number
    default: 0.0
    description: Drain diffusion area.
  - name: AS
    label: AS
    type: number
    default: 0.0
    description: Source diffusion area.
  - name: PD
    label: PD
    type: number
    default: 0.0
    description: Drain diffusion perimeter.
  - name: PS
    label: PS
    type: number
    default: 0.0
    description: Source diffusion perimeter.

symbol:
  bbox: [60, 60]
  shape: rect
  text: PMOS

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: semi.mosfet.p
