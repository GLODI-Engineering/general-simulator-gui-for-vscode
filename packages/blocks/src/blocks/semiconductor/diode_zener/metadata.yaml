name: semi.diode.zener
label: Zener Diode
version: 1
category: semiconductor
description: "Zener diode (XSPICE code model). ngspice only."

aliases: [Z, zener, zener diode]
tags: [semiconductor, electrical, diode, zener]

ports:
  inputs:
    - id: a
      label: Anode
      kind: { domain: physical-electrical }
      side: left
      offset: 20
  outputs:
    - id: k
      label: Cathode
      kind: { domain: physical-electrical }
      side: right
      offset: 20

params:
  - name: model
    label: Model
    type: string
    default: ""
    description: SPICE model name.
  - name: area
    label: Area
    type: number
    default: 1.0
    description: Area multiplier.

symbol:
  bbox: [60, 40]
  shape: rect
  text: Z

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: semi.diode.zener
