name: semi.diode
label: Diode
version: 1
category: semiconductor
description: "Standard PN junction diode (Level 1 Shockley model)."

aliases: [D, diode, pn junction]
tags: [semiconductor, electrical, diode]

ports:
  inputs:
    - id: a
      label: Anode
      kind: { domain: electrical }
      side: left
      offset: 20
  outputs:
    - id: k
      label: Cathode
      kind: { domain: electrical }
      side: right
      offset: 20

params:
  - name: model
    label: Model
    type: string
    default: ""
    description: SPICE model name.
  - name: area
    label: Area
    type: number
    default: 1.0
    description: area multiplier

symbol:
  bbox: [60, 40]
  shape: rect
  text: D

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: semi.diode
