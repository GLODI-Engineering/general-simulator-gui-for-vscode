name: tline.urc
label: "Uniform RC Line"
version: 1
category: tline
description: "Uniform distributed RC transmission line (URC model)."

aliases: [URC, RC line]
tags: [tline, electrical, rc, transmission-line, distributed]

ports:
  inputs:
    - id: a1
      label: "A1"
      kind: { domain: physical-electrical }
      side: left
      offset: 10
    - id: b1
      label: "B1"
      kind: { domain: physical-electrical }
      side: left
      offset: 30
  outputs:
    - id: a2
      label: "A2"
      kind: { domain: physical-electrical }
      side: right
      offset: 10
    - id: b2
      label: "B2"
      kind: { domain: physical-electrical }
      side: right
      offset: 30

params:
  - name: K
    label: K
    type: number
    default: 1.5
    description: "RC product scaling factor"
  - name: FMAX
    label: FMAX
    type: number
    default: 1e9
    description: "Maximum frequency of interest (Hz)"
  - name: RPERL
    label: RPERL
    type: number
    default: 1000.0
    description: "Resistance per metre (Ω/m)"
  - name: CPERL
    label: CPERL
    type: number
    default: 1e-9
    description: "Capacitance per metre (F/m)"
  - name: ISPERL
    label: ISPERL
    type: number
    default: 0.0
    description: "Saturation current per metre"
  - name: RSPERL
    label: RSPERL
    type: number
    default: 0.0
    description: "Reverse saturation resistance per metre"

symbol:
  bbox: [80, 60]
  shape: rect
  text: URC

behavior:
  causality: acausal
  domain: electrical
  state_count: 0
  equation_template: tline.urc
