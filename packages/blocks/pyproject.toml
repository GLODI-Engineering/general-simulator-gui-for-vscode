[project]
name = "blocks"
version = "0.1.0"
description = "Functional block library — control, power-stage, and signal blocks for the diagram editor."
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blocks"]
