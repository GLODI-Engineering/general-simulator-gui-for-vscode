[project]
name = "kernel-sidecar"
version = "0.1.0"
description = "Local Python sidecar — launched by Tauri, binds to 127.0.0.1 only."
requires-python = ">=3.11"
dependencies = [
    "kernel-core",
    "simulator",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "sympy>=1.13",
    "websockets>=13.0",
    "h5py>=3.11",
]

[project.scripts]
kernel-sidecar = "kernel_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_sidecar"]
