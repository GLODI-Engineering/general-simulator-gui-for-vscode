name: backend-v2-e2e

# Runs the v2 end-to-end roundtrip gate test (BE-41) on every PR and push.
# It exercises the v2 pipeline: load → flatten → resolve_goto_from → substitute_params
# → compile → solve. (`build_ir1`/`lower_ir2` were the Python-simulator lowering stages, which
# went with the backend refactor; gsim-core compiles the document now.)
# No host SPICE simulator is required.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-v2-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-e2e:
    name: v2 end-to-end gate (BE-41)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No cache: `uv.lock` is gitignored, so `cache-dependency-glob`'s default
      # `**/uv.lock` matches nothing in a fresh checkout and setup-uv fails the
      # job before it runs anything. Same fix as ci.yml's own python job.
      - uses: astral-sh/setup-uv@v3

      - name: Install workspace packages
        run: uv sync --all-packages --group dev

      - name: ruff lint (simulator)
        run: uv run ruff check packages/simulator/src/

      - name: mypy (simulator)
        run: uv run mypy packages/simulator/src/

      # test_v2_comprehensive.py was one of five e2e files the backend refactor deleted along
      # with the SPICE paths they covered. Naming a file that no longer exists made pytest exit
      # "file or directory not found" before running anything, so this gate had been failing
      # without testing a thing.
      - name: v2 e2e roundtrip test
        run: |
          uv run pytest \
            tests/backend/e2e/test_v2_roundtrip.py \
            -v --tb=short

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-e2e-test-results
          path: |
            .pytest_cache/
          retention-days: 7
